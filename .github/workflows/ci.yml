name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Unit tests use synthetic fixtures only: no downloads, no models, no API keys.
      - name: Install
        run: |
          pip install requests lxml beautifulsoup4 pyyaml pandas numpy "ragas==0.4.4" rapidfuzz \
                      fastapi httpx pytest ruff
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests app
      - name: Test
        run: pytest
