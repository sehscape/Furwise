# Which DailyMed animal labels count as "common dog & cat drugs".
#
# NAMES ONLY. This file holds search terms, never dosing, safety or indication
# facts. Everything Furwise says comes from the label text it downloads.
#
# A DailyMed label title joins a group if it contains one of the brands, or all of
# the ingredients. When several groups match, the more specific one wins
# (Heartgard Plus -> ivermectin + pyrantel, not plain ivermectin).
# Brands are listed pioneer-first: the original product is preferred over copies.

