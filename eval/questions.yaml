# Furwise evaluation set.
#
# Every answerable question points at the exact source text that supports it:
#   gold: [{entity, section, quote}]
# The quote is matched inside chunks at evaluation time (case/space insensitive), so
# gold survives re-chunking, and `furwise eval validate` fails as soon as a quote
# stops matching. References were written from that text only, never from general
# veterinary knowledge.
#
# expect:  answer    answer with citations
#          restrict  the label rules this species out: the answer must say so
#          emergency the answer must START with "Contact your vet or a pet poison helpline"
#          decline   outside the sources: must not answer
# species: the animal the question is about (dog / cat), used for species mix-up checks.

questions:
  # ------------------------------------------------------------------ label facts
  - id: L01
    category: label_fact
    question: What is Rimadyl used for in dogs?
    species: dog
    expect: answer
    gold: [{entity: carprofen, section: indications, quote: "relief of pain and inflammation associated with osteoarthritis"}]
    reference: Rimadyl is indicated for the relief of pain and inflammation associated with osteoarthritis and for the control of postoperative pain associated with soft tissue and orthopedic surgeries in dogs.

  - id: L02
    category: label_fact
    question: What is the recommended oral dose of Rimadyl for dogs?
    species: dog
    expect: answer
    gold: [{entity: carprofen, section: dosage, quote: "The recommended dosage for oral administration to dogs is 2 mg/lb"}]
    reference: The label recommends 2 mg/lb of body weight daily, given once daily or divided as 1 mg/lb twice daily.

  - id: L03
    category: label_fact
    question: Can my dog take Rimadyl together with a corticosteroid like prednisone?
    species: dog
    expect: answer
    gold: [{entity: carprofen, section: precautions, quote: "such as other NSAIDs or corticosteroids, should be avoided"}]
    reference: The label says concomitant use of Rimadyl with other anti-inflammatory drugs, such as other NSAIDs or corticosteroids, should be avoided because of the potential increase of adverse reactions, including gastrointestinal ulcerations and/or perforations.

  - id: L04
    category: label_fact
    question: What side effects should I watch for while my dog is on Rimadyl?
    species: dog
    expect: answer
    gold: [{entity: carprofen, section: owner_info, quote: "Adverse reactions may include decreased appetite, vomiting, diarrhea"}]
    reference: The owner information lists decreased appetite, vomiting, diarrhea, dark or tarry stools, increased water consumption, increased urination, pale gums, jaundice, lethargy, incoordination and seizures, among others.

  - id: L05
    category: label_fact
    question: How old does a dog have to be to use Apoquel?
    species: dog
    expect: answer
    gold: [{entity: oclacitinib, section: warnings, quote: "not for use in dogs less than 12 months of age"}]
    reference: Apoquel is not for use in dogs less than 12 months of age.

  - id: L06
    category: label_fact
    question: Does Apoquel make dogs more prone to infections?
    species: dog
    expect: answer
    gold: [{entity: oclacitinib, section: warnings, quote: "may increase susceptibility to infection, including demodicosis"}]
    reference: The label warns that Apoquel may increase susceptibility to infection, including demodicosis, and exacerbation of neoplastic conditions.

  - id: L07
    category: label_fact
    question: What is the Apoquel dose for dogs?
    species: dog
    expect: answer
    gold: [{entity: oclacitinib, section: dosage, quote: "0.18 to 0.27 mg oclacitinib/lb"}]
    reference: 0.18 to 0.27 mg oclacitinib/lb (0.4 to 0.6 mg/kg) body weight, orally, twice daily for up to 14 days, then once daily for maintenance.

  - id: L08
    category: label_fact
    question: What does Galliprant treat?
    species: dog
    expect: answer
    gold: [{entity: grapiprant, section: indications, quote: "control of pain and inflammation associated with osteoarthritis in dogs"}]
    reference: Galliprant is indicated for the control of pain and inflammation associated with osteoarthritis in dogs.

  - id: L09
    category: label_fact
    question: Can Galliprant cause vomiting in dogs?
    species: dog
    expect: answer
    gold: [{entity: grapiprant, section: precautions, quote: "Adverse reactions in dogs receiving GALLIPRANT may include vomiting"}]
    reference: Yes. Adverse reactions in dogs receiving Galliprant may include vomiting, diarrhea, decreased appetite, mucoid, watery or bloody stools, and decreases in serum albumin and total protein.

  - id: L10
    category: label_fact
    question: How often is the Bravecto chew given to dogs?
    species: dog
    expect: answer
    gold: [{entity: fluralaner, section: dosage, quote: "administered orally as a single dose every 12 weeks"}]
    reference: Bravecto chews are given orally as a single dose every 12 weeks.

  - id: L11
    category: label_fact
    question: Can I give Simparica to my 4 month old puppy?
    species: dog
    expect: answer
    gold: [{entity: sarolaner, section: warnings, quote: "should not be used in dogs less than 6 months of age"}]
    reference: No. The label says Simparica should not be used in dogs less than 6 months of age.

  - id: L12
    category: label_fact
    question: Is NexGard safe for a dog with a history of seizures?
    species: dog
    expect: answer
    gold: [{entity: afoxolaner, section: precautions, quote: "Use with caution in dogs with a history of seizures or neurologic disorders"}]
    reference: The label says the isoxazoline class has been associated with neurologic adverse reactions including tremors, ataxia and seizures, and to use with caution in dogs with a history of seizures or neurologic disorders.

  - id: L13
    category: label_fact
    question: Can Trifexis be given along with ivermectin?
    species: dog
    expect: answer
    gold: [{entity: spinosad-milbemycin, section: warnings, quote: "concomitant extra-label use of ivermectin with spinosad"}]
    reference: The label warns that serious adverse reactions have been reported following concomitant extra-label use of ivermectin with spinosad alone, a component of Trifexis.

  - id: L14
    category: label_fact
    question: Is Heartgard Plus safe for Collies?
    species: dog
    expect: answer
    gold: [{entity: ivermectin-pyrantel, section: overdose_safety, quote: "no signs of toxicity at 10 times the recommended dose"}]
    reference: Heartgard demonstrated no signs of toxicity at 10 times the recommended dose in sensitive Collies, and the label supports its safety in dogs, including Collies, when used as recommended.

  - id: L15
    category: label_fact
    question: From what age can puppies take Heartgard Plus?
    species: dog
    expect: answer
    gold: [{entity: ivermectin-pyrantel, section: dosage, quote: "recommended for dogs 6 weeks of age and older"}]
    reference: Heartgard Plus is recommended for dogs 6 weeks of age and older.

  - id: L16
    category: label_fact
    question: What is Cerenia used for in dogs?
    species: dog
