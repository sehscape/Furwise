    gold: [{entity: meloxicam, section: contraindications, quote: "Additional doses of meloxicam or other NSAIDs in cats are contraindicated"}]
    reference: No. Additional doses of meloxicam or other NSAIDs in cats are contraindicated, and repeated use of meloxicam in cats has been associated with acute renal failure and death.

