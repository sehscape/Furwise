    reference: Sileo is indicated for the treatment of noise aversion in dogs.

  - id: L20
    category: label_fact
    question: Which diabetic cats should not be given Bexacat?
    species: cat
    expect: answer
    gold: [{entity: bexagliflozin, section: contraindications, quote: "Do not use Bexacat in cats with diabetes mellitus who have previously been treated with insulin"}]
    reference: Do not use Bexacat in cats that have previously been treated with insulin, are receiving insulin, or have insulin-dependent diabetes mellitus.

  - id: L21
    category: label_fact
    question: What is Elura prescribed for in cats?
    species: cat
    expect: answer
    gold: [{entity: capromorelin, section: indications, quote: "management of weight loss in cats with chronic kidney disease"}]
    reference: Elura is for management of weight loss in cats with chronic kidney disease.

  - id: L22
