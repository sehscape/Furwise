    species: dog
    expect: answer
    gold: [{entity: cefovecin, section: dosage, quote: "therapeutic concentrations are maintained for approximately 7 days"}]
    reference: After an injection, therapeutic concentrations are maintained for approximately 7 days for Pasteurella multocida infections, and for 7 to 14 days for some other bacteria.

  - id: L24
