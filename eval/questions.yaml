    gold: [{entity: enrofloxacin, section: warnings, quote: "Do not exceed 5 mg/kg of body weight per day in cats"}]
    reference: Do not exceed 5 mg/kg of body weight per day in cats; in rare instances, use in cats has been associated with retinal toxicity.

  - id: L26
    category: label_fact
    question: What doses of Rimadyl were tested in the long-term safety studies?
    species: dog
    expect: answer
    gold: [{entity: carprofen, section: overdose_safety, quote: "up to 11.4 mg/lb/day (5.7 times the recommended total daily dose"}]
    reference: In 13 and 52 week safety studies, dogs were given up to 11.4 mg/lb/day, 5.7 times the recommended total daily dose of 2 mg/lb.

  - id: L27
