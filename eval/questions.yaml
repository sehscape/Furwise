    gold: [{entity: enrofloxacin, section: drug_interactions, quote: "metal cations (e.g., aluminum, calcium, iron, magnesium) may reduce the absorption"}]
    reference: The label says compounds that contain metal cations (aluminum, calcium, iron, magnesium) may reduce the absorption of quinolone drugs from the intestinal tract.

  - id: L25
    category: label_fact
    question: What is the maximum daily Baytril dose for cats?
    species: cat
