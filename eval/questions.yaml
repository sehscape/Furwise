    gold: [{entity: maropitant, section: dosage, quote: "Motion Sickness in dogs 4 months"}]
    reference: The motion sickness dosing on the label is for dogs 4 months of age and older.

  - id: L18
    category: label_fact
    question: When should Vetmedin not be given to a dog?
    species: dog
    expect: answer
    gold: [{entity: pimobendan, section: contraindications, quote: "in cases of hypertrophic cardiomyopathy, aortic stenosis"}]
    reference: Do not administer Vetmedin in cases of hypertrophic cardiomyopathy, aortic stenosis, or any other clinical condition where an augmentation of cardiac output is inappropriate.

